
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sham Style | شام ستايل</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fffafd;color:#38323a;font-family:Arial,sans-serif}
header{background:#f9e5ef;text-align:center;padding:28px 12px}
header h1{color:#a94f7d;margin:0;font-size:32px}
header p{margin:8px 0 0;color:#76576a}
main{max-width:650px;margin:20px auto;padding:14px}
.card{background:white;border:1px solid #f0dce7;border-radius:17px;padding:19px;margin-bottom:17px;box-shadow:0 3px 14px #8e52620c}
h2{font-size:20px;color:#a94f7d;margin:0 0 16px}
label{display:block;font-weight:bold;margin:13px 0 7px}
input,select,textarea{width:100%;padding:13px;border:1px solid #e5cfdb;border-radius:10px;background:#fff; font-size:16px;color:#38323a}
button{border:0;border-radius:11px;padding:13px 17px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:#b85f8b;color:white;width:100%;margin-top:15px}
.secondary{background:#f8e8f0;color:#9e4775}
.remove{background:#fff0f0;color:#b33}
.product-name{font-size:22px;font-weight:bold}
.price{color:#a94f7d;font-weight:bold;line-height:1.8}
.small{font-size:13px;color:#887987}
.cart-item{border-bottom:1px solid #f0e3eb;padding:12px 0}
.cart-item:last-child{border:0}
.cart-line{display:flex;justify-content:space-between;gap:10px;align-items:center}
.qty{display:flex;align-items:center;gap:12px;margin-top:10px}
.qty button{padding:6px 12px}
.total{font-size:20px;color:#a94f7d;font-weight:bold;margin-top:14px}
.hidden{display:none}
.notice{background:#f8e8f0;padding:13px;border-radius:10px;margin-top:12px;line-height:1.8}
footer{text-align:center;padding:22px;color:#997c8c;font-size:13px}
</style>
</head>
<body>

<header>
  <h1>Sham Style</h1>
  <p>أناقتك تبدأ من هون 🩷</p>
</header>

<main>

<section class="card">
  <h2>اختاري المنتج</h2>
  <div class="product-name">سيت شتوي ترندي</div>
  <div class="price">
    250,000 ل.س قديمة<br>
    2,500 ليرة سورية جديدة
  </div>
  <p class="small">سيت قطعتين من قماش تركي فليس مع ضمان</p>

  <label for="color">اللون</label>
  <select id="color">
    <option value="">اختاري اللون</option>
    <option>اللون الأول</option>
    <option>اللون الثاني</option>
    <option>اللون الثالث</option>
  </select>

  <label for="size">المقاس</label>
  <select id="size">
    <option value="">اختاري المقاس</option>
    <option>S</option>
    <option>M</option>
    <option>L</option>
    <option>XL</option>
    <option>XXL</option>
  </select>

  <button class="primary" onclick="addToCart()">إضافة إلى السلة 🛍️</button>
</section>

<section class="card">
  <h2>سلة المشتريات 🛒</h2>
  <div id="cartItems">السلة فارغة حالياً</div>
  <div id="cartTotal" class="total"></div>
</section>

<section class="card">
  <h2>بيانات الزبونة</h2>

  <label for="name">الاسم الكامل</label>
  <input id="name" placeholder="اسم الزبونة">

  <label for="phone">رقم الهاتف</label>
  <input id="phone" type="tel" placeholder="رقم الهاتف">

  <label for="method">طريقة التوصيل</label>
  <select id="method" onchange="deliveryChanged()">
    <option value="">اختاري طريقة التوصيل</option>
    <option value="branch">الشحن عبر فروع القدموس</option>
    <option value="courier">توصيل مباشر - دمشق وريف دمشق</option>
  </select>

  <div id="branchSection" class="hidden">
    <label for="governorate">اختاري المحافظة / مجموعة الفروع</label>
    <select id="governorate" onchange="branchesChanged()">
      <option value="">اختاري المجموعة</option>
    </select>

    <label for="branch">اختاري فرع القدموس</label>
    <select id="branch" disabled>
      <option value="">اختاري الفرع</option>
    </select>
  </div>

  <div id="courierSection" class="hidden">
    <label for="courierGov">المحافظة</label>
    <select id="courierGov">
      <option value="">اختاري المحافظة</option>
      <option>دمشق</option>
      <option>ريف دمشق</option>
    </select>

    <label for="locality">العنوان بالتفصيل</label>
    <textarea id="locality" rows="3" placeholder="المنطقة والشارع وأقرب نقطة دالة"></textarea>
  </div>

  <label for="notes">ملاحظات إضافية (اختياري)</label>
  <textarea id="notes" rows="2" placeholder="أي ملاحظات على الطلب"></textarea>

  <button class="primary" onclick="submitOrder()">إرسال الطلب عبر واتساب 💗</button>
  <div id="notice" class="notice hidden"></div>
</section>

</main>

<footer>Sham Style © جميع الحقوق محفوظة 🩷</footer>

<script>
const WHATSAPP_NUMBER = "963997050453";
const PRODUCT_NAME = "سيت شتوي ترندي";
const PRODUCT_PRICE = 2500;

const branchMap = {
  "فروع اللاذقية": [
    "8 آذار","الجامعة (سبيرو)","الزراعة",
    "سوق التجار","الرمل الشمالي","بوقا"
  ],
  "فروع جبلة": [
    "جبلة","جبلة رأس العين","القرداحة"
  ],
  "فروع حمص": [
    "الزهرا","الحمرا","الحضارة","جورة الشياح",
    "شين","الحواش (وادي النصارى)"
  ],
  "فروع حماه": [
    "الكراج","العاصي","سلحب","سقيلبية",
    "سلمية","مصياف","محردة"
  ],
  "فروع حلب": [
    "الفرقان","الجميلية"
  ],
  "فروع طرطوس": [
    "طرطوس","المنطار","المحطة","الكراج القديم",
    "الشيخ سعد","الشيخ بدر","دريكيش","صافيتا",
    "بانياس","مدينة القدموس"
  ],
  "فروع درعا": [
    "درعا (القصور)","الصنمين","القطيفة",
    "يبرود","قطنا","دير عطية","النبك"
  ],
  "أفرع محافظة دمشق": [
    "الحمرا","ضاحية الأسد","البرامكة","الحريقة",
    "جرمانا","جديدة عرطوز","صحنايا"
  ]
};

let cart = [];

function addToCart() {
  const color = document.getElementById("color").value;
  const size = document.getElementById("size").value;

  if (!color || !size) {
    alert("اختاري اللون والمقاس أولاً 🩷");
    return;
  }

  const existing = cart.find(
    item => item.color === color && item.size === size
  );

  if (existing) {
    existing.quantity++;
  } else {
    cart.push({ color, size, quantity: 1 });
  }

  renderCart();
  document.getElementById("notice").classList.add("hidden");
}

function renderCart() {
  const container = document.getElementById("cartItems");
  const totalBox = document.getElementById("cartTotal");

  if (!cart.length) {
    container.textContent = "السلة فارغة حالياً";
    totalBox.textContent = "";
    return;
  }

  container.innerHTML = "";

  cart.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "cart-item";

    const line = document.createElement("div");
    line.className = "cart-line";

    const details = document.createElement("div");
    details.textContent =
      PRODUCT_NAME + " - " + item.color + " - مقاس " + item.size;

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "حذف";
    remove.onclick = () => {
      cart.splice(index, 1);
      renderCart();
    };

    line.append(details, remove);

    const qty = document.createElement("div");
    qty.className = "qty";

    const minus = document.createElement("button");
    minus.className = "secondary";
    minus.textContent = "−";
    minus.onclick = () => {
      item.quantity--;
      if (item.quantity <= 0) cart.splice(index, 1);
      renderCart();
    };

    const count = document.createElement("strong");
    count.textContent = item.quantity;

    const plus = document.createElement("button");
    plus.className = "secondary";
    plus.textContent = "+";
    plus.onclick = () => {
      item.quantity++;
      renderCart();
    };

    qty.append(minus, count, plus);
    div.append(line, qty);
    container.append(div);
  });

  const totalQuantity = cart.reduce(
    (sum, item) => sum + item.quantity, 0
  );

  totalBox.textContent =
    "الإجمالي: " +
    (totalQuantity * PRODUCT_PRICE).toLocaleString("en-US") +
    " ليرة سورية جديدة";
}

function deliveryChanged() {
  const method = document.getElementById("method").value;
  const branchSection = document.getElementById("branchSection");
  const courierSection = document.getElementById("courierSection");

  branchSection.classList.toggle("hidden", method !== "branch");
  courierSection.classList.toggle("hidden", method !== "courier");

  if (method === "branch") {
    const governorate = document.getElementById("governorate");
    governorate.innerHTML = '<option value="">اختاري المجموعة</option>';

    Object.keys(branchMap).forEach(group => {
      const option = document.createElement("option");
      option.value = group;
      option.textContent = group;
      governorate.appendChild(option);
    });

    document.getElementById("branch").innerHTML =
      '<option value="">اختاري الفرع</option>';
    document.getElementById("branch").disabled = true;
  }
}

function branchesChanged() {
  const group = document.getElementById("governorate").value;
  const branchSelect = document.getElementById("branch");

  branchSelect.innerHTML = '<option value="">اختاري الفرع</option>';

  if (!group || !branchMap[group]) {
    branchSelect.disabled = true;
    return;
  }

  branchMap[group].forEach(branch => {
    const option = document.createElement("option");
    option.value = branch;
    option.textContent = branch;
    branchSelect.appendChild(option);
  });

  branchSelect.disabled = false;
}

function submitOrder() {
  if (!cart.length) {
    alert("أضيفي منتجاً إلى السلة أولاً");
    return;
  }

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const method = document.getElementById("method").value;
  const notes = document.getElementById("notes").value.trim();

  if (!name || !phone || !method) {
    alert("كمّلي الاسم والهاتف وطريقة التوصيل");
    return;
  }

  let governorate = "";
  let delivery = "";
  let deliveryType = "";

  if (method === "branch") {
    governorate = document.getElementById("governorate").value;
    delivery = document.getElementById("branch").value;
    deliveryType = "الشحن عبر فرع القدموس";

    if (!governorate || !delivery) {
      alert("اختاري مجموعة الفروع والفرع");
      return;
    }
  } else if (method === "courier") {
    governorate = document.getElementById("courierGov").value;
    delivery = document.getElementById("locality").value.trim();
    deliveryType = "توصيل مباشر";

    if (!governorate || !delivery) {
      alert("اختاري المحافظة واكتبي العنوان بالتفصيل");
      return;
    }
  }

  const totalQuantity = cart.reduce(
    (sum, item) => sum + item.quantity, 0
  );
  const total = totalQuantity * PRODUCT_PRICE;

  let message =
    "🩷 *طلب جديد من شام ستايل* 🩷\n\n" +
    "👤 الاسم: " + name + "\n" +
    "📞 هاتف الزبونة: " + phone + "\n" +
    "📍 المحافظة: " + governorate + "\n" +
    "🚚 طريقة التوصيل: " + deliveryType + "\n" +
    "🏢 الفرع / العنوان: " + delivery + "\n\n" +
    "🛍️ *تفاصيل الطلب:*\n";

  cart.forEach((item, index) => {
    message +=
      (index + 1) + ". " + PRODUCT_NAME + "\n" +
      "اللون: " + item.color + "\n" +
      "المقاس: " + item.size + "\n" +
      "الكمية: " + item.quantity + "\n\n";
  });

  message +=
    "🔢 إجمالي القطع: " + totalQuantity + "\n" +
    "💰 الإجمالي: " + total.toLocaleString("en-US") +
    " ليرة سورية جديدة\n";

  if (notes) {
    message += "📝 ملاحظات: " + notes + "\n";
  }

  message += "\nبانتظار تأكيد الطلب 🩷";

  const url =
    "https://wa.me/" + WHATSAPP_NUMBER +
    "?text=" + encodeURIComponent(message);

  document.getElementById("notice").textContent =
    "تم تجهيز الطلب. اضغطي إرسال داخل واتساب حتى يصل إلينا 🩷";
  document.getElementById("notice").classList.remove("hidden");

  window.open(url, "_blank");
}
</script>
</body>
</html>
